<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1A0F08" />
  <title>炙巷食铺 · 手机端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1A0F08;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      color: #fff;
      overflow-x: hidden;
    }
    .container {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      background: radial-gradient(ellipse at top, #2D1810 0%, #1A0F08 60%);
    }
    .logo {
      width: 100px; height: 100px;
      border-radius: 24px;
      background: linear-gradient(135deg, #E85D04 0%, #DC2F02 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 40px rgba(232,93,4,0.3);
      margin-bottom: 20px;
    }
    .title {
      font-size: 26px; font-weight: 700;
      letter-spacing: 0.5em;
      color: #E85D04;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px; color: #8B6F5E;
      margin-bottom: 36px;
    }
    .info-card {
      background: #241510;
      border: 1px solid #3D2518;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
    }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid #3D2518;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #8B6F5E; }
    .info-value { color: #fff; font-weight: 500; }
    .download-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #E85D04, #DC2F02);
      color: #fff;
      font-size: 18px; font-weight: 600;
      padding: 16px 48px;
      border-radius: 14px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(232,93,4,0.4);
      margin-bottom: 16px;
    }
    .download-btn:active { transform: scale(0.96); }
    .hint {
      font-size: 12px; color: #6B4F3E;
      margin-top: 8px;
    }
    .footer {
      margin-top: 40px;
      font-size: 11px; color: #4A3020;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍽️</div>
    <div class="title">炙巷食铺</div>
    <div class="subtitle">手机端 · Android</div>

    <div class="info-card">
      <div class="info-row">
        <span class="info-label">版本</span>
        <span class="info-value" id="version">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">构建</span>
        <span class="info-value" id="versionCode">-</span>
      </div>
      <div class="info-row">
        <span class="info-label">大小</span>
        <span class="info-value" id="size">-</span>
      </div>
    </div>

    <a class="download-btn" id="downloadBtn" href="#" onclick="downloadAPK()">
      📥 下载 Android APK
    </a>
    <span class="hint">点击下载安装包</span>

    <div class="footer">© 2026 炙巷食铺</div>
  </div>

  <script>
    async function init() {
      try {
        const resp = await fetch('/version.json');
        const data = await resp.json();
        document.getElementById('version').textContent = data.versionName || '-';
        document.getElementById('versionCode').textContent = 'Build ' + (data.versionCode || '-');
        document.getElementById('downloadBtn').href = data.apkUrl || '/zhixiangshipu-app.apk';
      } catch(e) {
        document.getElementById('downloadBtn').href = '/zhixiangshipu-app.apk';
      }

      const sizeEl = document.getElementById('size');
      try {
        const resp = await fetch('/zhixiangshipu-app.apk', { method: 'HEAD' });
        const cl = resp.headers.get('content-length');
        if (cl) sizeEl.textContent = (cl / 1024 / 1024).toFixed(1) + ' MB';
        else sizeEl.textContent = '8.6 MB';
      } catch(e) { sizeEl.textContent = '8.6 MB'; }
    }

    function downloadAPK() {
      window.open(document.getElementById('downloadBtn').href, '_blank');
    }

    init();
  </script>
</body>
</html>
