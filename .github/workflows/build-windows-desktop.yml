name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        shell: bash
        run: chmod +x gradlew

      - name: Build Windows desktop distributable
        shell: bash
        run: ./gradlew :composeApp:createDistributable --no-daemon

      - name: Zip distributable
        shell: powershell
        run: |
          Compress-Archive -Path composeApp/build/compose/binaries/main/app/* -DestinationPath zxsp-desktop-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zxsp-desktop-windows
          path: zxsp-desktop-windows.zip
